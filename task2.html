<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
      color:white;
    }

    /* Main Container */

    .container{
      width:420px;
      padding:30px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      text-align:center;
    }

    h1{
      margin-bottom:25px;
      font-size:35px;
      color:#00d4ff;
      letter-spacing:3px;
    }

    /* Circle Timer */

    .circle{
      width:280px;
      height:280px;
      border-radius:50%;
      border:8px solid #00d4ff;
      margin:auto;
      display:flex;
      justify-content:center;
      align-items:center;
      background:rgba(255,255,255,0.05);
      box-shadow:
      0 0 20px #00d4ff,
      0 0 40px rgba(0,212,255,0.3);
    }

    .time{
      font-size:45px;
      font-weight:bold;
      letter-spacing:2px;
    }

    /* Buttons */

    .buttons{
      margin-top:30px;
    }

    button{
      padding:12px 18px;
      margin:8px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      color:white;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.08);
    }

    .start{
      background:#22c55e;
    }

    .pause{
      background:#facc15;
      color:black;
    }

    .reset{
      background:#ef4444;
    }

    .lap{
      background:#3b82f6;
    }

    /* Lap Section */

    .laps{
      margin-top:25px;
      max-height:180px;
      overflow-y:auto;
      text-align:left;
    }

    .laps li{
      list-style:none;
      background:rgba(255,255,255,0.1);
      padding:10px;
      margin:8px 0;
      border-radius:10px;
      transition:0.3s;
    }

    .laps li:hover{
      background:rgba(255,255,255,0.2);
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>STOPWATCH</h1>

    <div class="circle">
      <div class="time" id="display">
        00:00:00
      </div>
    </div>

    <div class="buttons">

      <button class="start" onclick="startStopwatch()">
        Start
      </button>

      <button class="pause" onclick="pauseStopwatch()">
        Pause
      </button>

      <button class="reset" onclick="resetStopwatch()">
        Reset
      </button>

      <button class="lap" onclick="recordLap()">
        Lap
      </button>

    </div>

    <ul class="laps" id="laps"></ul>

  </div>

  <script>

    let seconds = 0;
    let minutes = 0;
    let hours = 0;
    let timer = null;
    let lapCount = 1;

    function updateDisplay(){

      let h = hours < 10 ? "0" + hours : hours;
      let m = minutes < 10 ? "0" + minutes : minutes;
      let s = seconds < 10 ? "0" + seconds : seconds;

      document.getElementById("display").innerText =
      `${h}:${m}:${s}`;
    }

    function stopwatch(){

      seconds++;

      if(seconds == 60){
        seconds = 0;
        minutes++;
      }

      if(minutes == 60){
        minutes = 0;
        hours++;
      }

      updateDisplay();
    }

    function startStopwatch(){

      if(timer !== null) return;

      timer = setInterval(stopwatch,1000);
    }

    function pauseStopwatch(){

      clearInterval(timer);
      timer = null;
    }

    function resetStopwatch(){

      clearInterval(timer);
      timer = null;

      seconds = 0;
      minutes = 0;
      hours = 0;
      lapCount = 1;

      updateDisplay();

      document.getElementById("laps").innerHTML = "";
    }

    function recordLap(){

      if(hours === 0 && minutes === 0 && seconds === 0) return;

      let lapTime =
      document.getElementById("display").innerText;

      let li = document.createElement("li");

      li.innerText =
      "Lap " + lapCount + " : " + lapTime;

      document.getElementById("laps").appendChild(li);

      lapCount++;
    }

  </script>

</body>
</html>
